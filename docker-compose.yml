services:
  sql-schema-mcp:
    build: .
    env_file:
      - .env
    ports:
      - "${SQLMCP_Mcp__Port:-5101}:${SQLMCP_Mcp__Port:-5101}"
    volumes:
      - audit-data:/data
    restart: unless-stopped
    networks:
      - mcp_default1

networks:
  mcp_default1:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1

volumes:
  audit-data:
